name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      LLVM_PREFIX: /usr/lib/llvm-18/bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            lld-18 \
            llvm-18 \
            make

      - name: Show tool versions
        run: |
          "$LLVM_PREFIX/clang" --version
          "$LLVM_PREFIX/ld.lld" --version
          "$LLVM_PREFIX/llvm-objcopy" --version

      - name: Build SDK
        run: make -B

      - name: Build checkout device example
        run: make -C sample/device_example SDK=../.. -B

      - name: Install SDK layout
        run: sudo -E bash ./install.sh

      - name: Build installed hello world example
        run: make -C sample/hello_world -B

      - name: Build installed device example
        run: make -C sample/device_example -B
